<!-- Probe page for tools/probe-viewer.mjs: the real emitter output for
     fixtures/droid.json (level "droid") inlined, viewer.js by relative path.
     Not served by the server; the fixture's own script writes the JSON report
     into the #probe pre. The corpus emits no data-desc, so the script puts
     one on a node — the viewer only ever reads the attribute. -->

font-family="DejaVu Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#cfe3f2">segments</text></g><g data-chip="1"><rect x="524.5" y="392.6" width="86.5" height="18" rx="4" fill="#0f1a27" stroke="#2a3a4f"/><text x="567.8" y="401.6" font-family="DejaVu Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#cfe3f2">every action</text></g><g data-chip="1"><rect x="275" y="139" width="66" height="18" rx="4" fill="#0f1a27" stroke="#2a3a4f"/><text x="308" y="148" font-family="DejaVu Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#cfe3f2">playback</text></g><g data-chip="1"><rect x="275.5" y="170.2" width="77" height="18" rx="4" fill="#0f1a27" stroke="#2a3a4f"/><text x="314" y="179.2" font-family="DejaVu Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#cfe3f2">keys · tabs</text></g><g data-chip="1"><rect x="476.5" y="215.8" width="95" height="18" rx="4" fill="#0f1a27" stroke="#2a3a4f"/><text x="524" y="224.8" font-family="DejaVu Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#cfe3f2">spawns shells</text></g><g data-chip="1"><rect x="791.5" y="185.3" width="79" height="18" rx="4" fill="#0f1a27" stroke="#2a3a4f"/><text x="831" y="194.3" font-family="DejaVu Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#cfe3f2">job records</text></g><g data-chip="1"><rect x="489.3" y="337" width="76.5" height="18" rx="4" fill="#0f1a27" stroke="#2a3a4f"/><text x="527.5" y="346" font-family="DejaVu Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#cfe3f2">run events</text></g></g></svg></main>
<aside id="c4-hover" hidden></aside>
<div id="c4-legend" role="group" aria-label="Legend"></div>
<div id="c4-mini"></div>
<pre id="probe" hidden></pre>
<script src="viewer.js"></script>
<script src="flow.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const facts = {}
  const errors = []
  try {
    const c4 = window.__c4
    if (!c4) throw new Error('window.__c4 missing')
    const stage = document.getElementById('c4-stage')
    const svg = stage.querySelector('svg')
    const rootG = svg.querySelector('g.c4-root') || svg.querySelector('g')
    const card = document.getElementById('c4-hover')

    const fit = c4.fit()
    facts.fit = fit
    facts.transform = rootG.getAttribute('transform')
    facts.fitFinite =
      Number.isFinite(fit.k) && Number.isFinite(fit.x) && Number.isFinite(fit.y) && fit.k > 0
    facts.fit2 = c4.fit()

    // rule 1: the whole drawing visible, 24px padding, nothing clipped
    const sb = stage.getBoundingClientRect()
    const gb = rootG.getBoundingClientRect()
    facts.bounds = {
      pad: { left: gb.left - sb.left, top: gb.top - sb.top, right: sb.right - gb.right, bottom: sb.bottom - gb.bottom },
      stage: { w: sb.width, h: sb.height },
      drawing: { w: gb.width, h: gb.height },
    }

    const box = stage.getBoundingClientRect()
    const cx = box.left + box.width / 2
    const cy = box.top + box.height / 2
    facts.wheelBefore = c4.view().k
    stage.dispatchEvent(new WheelEvent('wheel', { deltaY: -240, clientX: cx, clientY: cy, bubbles: true, cancelable: true }))
    facts.wheelAfter = c4.view().k

    const before = c4.view()
    const pointer = (type, x, y, buttons) => new PointerEvent(type, {
      pointerId: 1, pointerType: 'mouse', isPrimary: true, button: type === 'pointerup' ? 0 : 0,
      buttons, clientX: x, clientY: y, bubbles: true, cancelable: true,
    })
    stage.dispatchEvent(pointer('pointerdown', 80, 80, 1))
    stage.dispatchEvent(pointer('pointermove', 150, 130, 1))
    stage.dispatchEvent(pointer('pointerup', 150, 130, 0))
    facts.drag = { before: { x: before.x, y: before.y }, after: { x: c4.view().x, y: c4.view().y } }
    c4.fit()

    // the node the probe hovers is also the node it drills: one real emitted
    // node carrying the emitter's data-drill, plus the attribute the emitter
    // would write if the model had a desc.
    const node = svg.querySelector('g[data-id][data-drill]')
    if (!node) throw new Error('no g[data-id][data-drill] in fixture svg')
    const DESC = 'Probe hover description'
    node.setAttribute('data-desc', DESC)
    const hoverBefore = c4.view()
    const nb = node.getBoundingClientRect()
    node.dispatchEvent(new PointerEvent('pointermove', {
      pointerId: 2, pointerType: 'mouse', clientX: nb.left + nb.width / 2, clientY: nb.top + nb.height / 2, bubbles: true,
    }))
    facts.hover = {
      node: node.dataset.id,
      hidden: card.hidden,
      label: (card.querySelector('.c4-hover-title') || {}).textContent || '',
      desc: (card.querySelector('.c4-hover-desc') || {}).textContent || '',
      text: card.textContent,
      expectedDesc: DESC,
    }

    facts.hoverView = { before: hoverBefore, after: c4.view() }
    facts.clamp = { max: c4.zoomAt(cx, cy, 100).k, min: c4.zoomAt(cx, cy, 0.000001).k }
    c4.fit() // leave the page looking fitted, not at the 0.3 floor

    facts.drill = {
      node: node.dataset.id,
      drill: node.dataset.drill || null,
      root: document.body.dataset.root,
      url: c4.drillUrl(node),
      expected: `${document.body.dataset.root}/${node.dataset.drill || ''}`,
    }

    const kinds = [...new Set([...svg.querySelectorAll('g[data-id]')].map((n) => n.dataset.kind).filter(Boolean))].sort()
    facts.legend = {
      kinds,
      swatches: document.querySelectorAll('#c4-legend .c4-sw').length,
      fills: [...document.querySelectorAll('#c4-legend .c4-sw i')].map((i) => i.style.background),
    }
    // ---- flow: exactly one dot, one edge at a time, in the emitter's data-flow order
    const flow = c4.flow
    const settle = () => new Promise((res) => {
      const t = setTimeout(res, 300)
      requestAnimationFrame(() => requestAnimationFrame(() => { clearTimeout(t); res() }))
    })
    const dots = () => document.querySelectorAll('.c4-dot').length
    const cap = () => document.getElementById('c4-flow-text').textContent
    const playLabel = () => document.getElementById('c4-flow-play').textContent

    facts.flowOrder = flow.order
    facts.flowPaths = svg.querySelectorAll('path[data-flow]').length
    const spaceState = { play: playLabel(), dots: dots() }
    flow.play()
    await settle()
    facts.flowPlaying = { dots: dots(), caption: cap(), current: flow.current() }
    flow.pause()
    const wasAt = flow.current()
    flow.step(1)
    await settle()
    facts.flowStep = { from: wasAt, to: flow.current(), dots: dots(), caption: cap() }
    while (flow.current() < flow.order.length - 1) flow.step(1)
    flow.step(1) // stepping past the last edge stops the flow
    await settle()
    facts.flowEnd = { dots: dots(), caption: cap(), current: flow.current() }

    const press = () => document.dispatchEvent(new KeyboardEvent('keydown', { key: ' ', bubbles: true, cancelable: true }))
    press()
    await settle()
    press()
    await settle()
    facts.flowSpace = { before: spaceState, after: { play: playLabel(), dots: dots() } }

    facts.viewApi = Object.keys(c4).sort()
  } catch (err) {
    errors.push(String((err && err.stack) || err))
  }
  const probe = document.getElementById('probe')
  probe.textContent = JSON.stringify({ facts, errors })
})
</script>
